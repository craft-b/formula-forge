name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          # Real key not required — LLM calls are mocked in all tests.
          GROQ_API_KEY: test-key-ci-placeholder
          LLM_PROVIDER: groq
          GROQ_MODEL: llama-3.3-70b-versatile
        run: pytest tests/ -v
