name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # CI ran the tests and the eval but never read the code. Five dead
        # imports and a duplicated origin parser lived in main.py through both.
        # F/E9/B only: unused and undefined names, syntax errors, and bugbear's
        # real-defect rules. Style modernisation is deliberately not gated.
        working-directory: backend
        run: ruff check .

      - name: Run tests (unit, domain, gate, golden-set eval)
        working-directory: backend
        env:
          # Real key not required — LLM calls are mocked in all tests.
          GROQ_API_KEY: test-key-ci-placeholder
          LLM_PROVIDER: groq
          GROQ_MODEL: llama-3.3-70b-versatile
        run: pytest tests/ -v

      - name: Routing eval (offline — no API key, gates against baseline)
        working-directory: backend
        env:
          GROQ_API_KEY: test-key-ci-placeholder
        run: python -m eval.live_eval --offline --gate

      - name: Check generated frontend types are in sync
        working-directory: backend
        env:
          GROQ_API_KEY: test-key-ci-placeholder
        run: |
          python -m scripts.gen_frontend_types
          git diff --exit-code ../frontend/src/types/api.ts \
            || (echo "::error::frontend/src/types/api.ts is stale — run 'python -m scripts.gen_frontend_types'" && exit 1)

  frontend:
    # `npm ci` installs strictly from package-lock.json, which makes the lockfile
    # responsible for listing a native binary for THIS platform. npm records only
    # the variants it resolved on the machine that generated it, so a lockfile
    # written on Windows can carry lightningcss-win32-x64-msvc and no Linux
    # equivalent - and this job then installs no binary at all and fails on a
    # module it cannot find. Both packages are pinned as optionalDependencies in
    # frontend/package.json to force the Linux entries into the lockfile; keep
    # their versions in step with lightningcss and rolldown when either bumps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        # package.json has carried a `lint` script that CI never ran, and it had
        # drifted to five errors — so the command was there but unusable. Gated
        # now, before the build, so it cannot drift again.
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
